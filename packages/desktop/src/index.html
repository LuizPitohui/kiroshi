<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      A interface nao carrega nada de fora: scripts e estilos sao empacotados.
      As unicas origens externas sao imagens e midia dos anexos do proprio
      servidor, e as conexoes de API, gateway e SFU.

      Scripts so do proprio pacote (`script-src 'self'`). Ate a 2.0.1 havia
      tambem `wasm-unsafe-eval` e `blob:` para a limpeza de ruido por modelo
      (DeepFilterNet3 e GTCRN, em WASM dentro de um AudioWorklet) e o esquema
      `kiroshi-modelos:` em connect-src para ler os arquivos dele. A limpeza
      por modelo saiu para ser refeita do zero (backlog F3), e as tres
      liberacoes sairam com ela. Se a nova precisar de WASM, volta so
      `wasm-unsafe-eval` — nunca `unsafe-eval`, que liberaria `eval()`.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https: http:; media-src 'self' blob: https: http:; font-src 'self' data:; connect-src 'self' ws: wss: http: https:; frame-src 'none'; object-src 'none'"
    />
    <title>Kiroshi</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
